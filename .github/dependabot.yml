# Weekly update PRs, one per ecosystem and directory, with minor and patch
# bumps grouped so the queue stays short. Majors arrive one PR each, since
# they are the ones that need reading. A release is proposed only once it is a
# week old (cooldown): a hijacked release is usually caught and pulled within
# days. Security fixes skip both the schedule and the cooldown: Dependabot
# opens those as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Base images in backend/Dockerfile and nginx/Dockerfile; the compose
  # files' MySQL and Redis images are the docker-compose entry below
  - package-ecosystem: docker
    directories: [/backend, /nginx]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node's odd majors are short-lived, and the toolchain skips them. Bump
      # to the next LTS by hand, together with setup-node in both workflows.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Python's version is also in setup-python (both workflows) and
      # backend/lock_deps.sh, which a PR for the Dockerfile alone would leave
      # behind. Bump all of them by hand, then re-lock.
      - dependency-name: python
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Stay on the 8.4 LTS line; MySQL 9.x releases are short-lived
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
