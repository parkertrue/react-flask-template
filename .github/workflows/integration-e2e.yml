name: Integration & E2E

# These need Docker (and browsers, for E2E), so they take a few minutes. They
# run on every pull request, so nothing (Dependabot's PRs included) merges
# without them, and nightly, to catch drift in the base images and the
# services' latest patch releases.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily

# Jobs only read the repository; a compromised step gets no write token.
permissions:
  contents: read

# Per ref, so one pull request's run never cancels another's
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Start test services
        run: docker compose --env-file .env.test -f docker-compose.test.yml up -d --wait

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run integration tests
        working-directory: backend
        run: |
          set -a && . ../.env.test && set +a
          pytest tests/integration

      - name: Service logs on failure
        if: failure()
        run: docker compose --env-file .env.test -f docker-compose.test.yml logs

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.test -f docker-compose.test.yml down -v

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # nginx/certs/ is gitignored and the e2e stack terminates TLS, so mint a
      # throwaway self-signed pair. Playwright is configured to ignore the
      # resulting cert warnings.
      - name: Generate self-signed certificates
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout nginx/certs/privkey.pem \
            -out nginx/certs/fullchain.pem \
            -subj "/CN=localhost"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Pulls and builds take most of webServer's 120s timeout on a cold
      # runner, so they happen here and webServer's --build is all cache hits
      - name: Build the E2E stack
        run: |
          docker compose --env-file .env.test -f docker-compose.test.yml --profile e2e build --pull
          docker compose --env-file .env.test -f docker-compose.test.yml --profile e2e pull db redis

      # playwright.config.js brings the e2e compose profile up itself via its
      # webServer block, and does not reuse an existing server when CI is set.
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      # Every line the backend image wrote, gunicorn's and the migrations'
      # included, must be JSON: a log shipper drops a line it cannot parse
      - name: Backend log is JSON
        run: |
          for service in migrate backend; do
            docker compose --env-file .env.test -f docker-compose.test.yml --profile e2e \
              logs --no-log-prefix --no-color "$service" \
              | python3 .github/scripts/check_json_logs.py
          done

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.test -f docker-compose.test.yml --profile e2e down -v
