# The rules are listed in full, since ruff's own default set is far wider and
# changes between releases. Widen `select` if you want more.
# - E4, E7, E9 and F (pyflakes and syntax errors) catch real bugs such as
#   unused imports and undefined names.
# - W505 keeps comments and docstrings within 88 characters a line, so none
#   runs on past its neighbours.
# - Q keeps quotes consistent: single for strings, double for docstrings.
# - T20 (print), ERA (commented-out code) and FIX (TODO, FIXME, HACK, XXX)
#   keep leftovers out; the app logs through `logging`.
# - TID252 bans relative imports, so the import-rule test
#   (tests/unit/test_import_rules.py), which reads only absolute ones, sees
#   every import. TID251 bans the calls listed below, among them every way
#   to reach another server: the files allowed to, in per-file-ignores, are
#   the one list of the third parties the backend talks to. It also bans
#   hmac.new and its kin outside app/utils/keys.py, which gives each use of
#   SECRET_KEY a key of its own.
# - DTZ refuses naive datetimes: every timestamp is UTC.
# - S102 and S307 refuse exec and eval; S608 refuses SQL built from strings.
# - B017 refuses pytest.raises(Exception), which passes on any error at all.
# - RUF100 refuses a noqa that suppresses nothing.
[lint]
select = ["E4", "E7", "E9", "F", "W505", "Q", "T20", "ERA", "FIX", "TID251", "TID252", "DTZ", "S102", "S307", "S608", "B017", "RUF100"]

[lint.pycodestyle]
max-doc-length = 88

[lint.flake8-quotes]
inline-quotes = "single"

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Rules CLAUDE.md states, enforced
[lint.flake8-tidy-imports.banned-api]
"flask_jwt_extended.get_jwt_identity".msg = "Read the user from flask_jwt_extended.current_user, which the user loader checks still exists."
"pytest.skip".msg = "A skipped test passes whatever the code does."
"pytest.mark.skip".msg = "A skipped test passes whatever the code does."
"pytest.mark.skipif".msg = "A skipped test passes whatever the code does."
"pytest.importorskip".msg = "A skipped test passes whatever the code does."
"pytest.mark.xfail".msg = "An expected failure passes whatever the code does."
"subprocess".msg = "The app runs no other programs."
"os.system".msg = "The app runs no other programs."
"urllib.request".msg = "Calls another server: add the file to per-file-ignores below, and the service to the privacy notice (docs/personal-data.md)."
"http.client".msg = "Calls another server: add the file to per-file-ignores below, and the service to the privacy notice (docs/personal-data.md)."
"smtplib".msg = "Calls another server: add the file to per-file-ignores below, and the service to the privacy notice (docs/personal-data.md)."
"socket".msg = "Calls another server: add the file to per-file-ignores below, and the service to the privacy notice (docs/personal-data.md)."
"requests".msg = "Calls another server: add the file to per-file-ignores below, and the service to the privacy notice (docs/personal-data.md)."
"httpx".msg = "Calls another server: add the file to per-file-ignores below, and the service to the privacy notice (docs/personal-data.md)."
"hmac.new".msg = "Use app.utils.keys.keyed, which gives each purpose its own key."
"hmac.HMAC".msg = "Use app.utils.keys.keyed, which gives each purpose its own key."
"hmac.digest".msg = "Use app.utils.keys.keyed, which gives each purpose its own key."

# The files that call another server, each named with its service. A test that
# stands in for one marks its import `# noqa: TID251` instead, so the
# skipped-test bans above still cover it.
[lint.per-file-ignores]
"app/utils/breached.py" = ["TID251"]  # Pwned Passwords' range API
"app/utils/mail.py" = ["TID251"]  # the mail server (EMAIL_URL)
