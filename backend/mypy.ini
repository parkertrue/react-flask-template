# A bare `mypy` checks the app and the scripts beside it, in strict
# mode: every function annotated, nothing typed Any by accident, and no
# `type: ignore` left that ignores nothing. The tests are left out (ruff and
# tests/unit/test_assertions.py guard them), and so are the migrations, each
# a snapshot that is never edited.
[mypy]
files = app, wait_for_services.py, wsgi.py, export_schemas.py
strict = true
# Reads the Pydantic models' fields as the constructor's arguments
plugins = pydantic.mypy
# Flask-JWT-Extended's @jwt_required is untyped, which would make every
# route behind it untyped. Each route's body is still checked, and no code
# calls a route.
disable_error_code = untyped-decorator

# Ships no types, and the app factory is its only use
[mypy-flask_migrate.*]
ignore_missing_imports = true
