# A generic, single database configuration.

[alembic]
# Name each migration file after its revision id alone (0001_users.py), not
# Alembic's default <rev>_<slug>, which repeats the name given to --rev-id
file_template = %%(rev)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

# JSON, like every other line the backend image writes (the migrate service
# runs these)
[formatter_generic]
class = app.utils.log.JsonFormatter
