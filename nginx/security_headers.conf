# Included by every location of the app's server (app_server.conf) and of
# behind-proxy mode's health check, directly or through resource_headers.conf.
# A location that declares any add_header of its own inherits none from the
# server block, so each one includes this file rather than relying on
# inheritance.
# includeSubDomains makes browsers refuse plain HTTP on every subdomain of the
# deployed domain for a year; drop it if any subdomain is not served over TLS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
