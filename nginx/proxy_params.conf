proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
# The client's address alone, not the chain it arrived with: nginx has
# already taken it from a trusted load balancer's header, if any (real-ip.conf,
# nginx/server-mode.sh), so the backend trusts exactly one hop
# (TRUSTED_PROXY_COUNT) and nothing a client wrote reaches it.
proxy_set_header X-Forwarded-For $remote_addr;
# Set by the server template for NGINX_MODE (servers/)
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
# The access log's request_id, which the backend adds to its own lines
proxy_set_header X-Request-ID $request_id;

proxy_buffers 16 16k;
proxy_buffer_size 32k;
proxy_busy_buffers_size 64k;

# A connect inside one Docker host takes well under a millisecond, so waiting
# longer for a stopped backend only delays its 504 (every request to one waits
# this long: its address is fixed, templates/00-upstream.conf.template). The
# read timeout is the one matched to gunicorn's --timeout.
proxy_connect_timeout 2s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

proxy_redirect off;
