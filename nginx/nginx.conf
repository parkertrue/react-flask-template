worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # What the access log keeps of the client's own text. The path, without
    # its query string: a link that carries a token (a password reset, an
    # email verification) must not leave it in the log. Each field is capped,
    # since a client may send 8 KB of each (large_client_header_buffers), and
    # lines that long would roll Docker's 30 MB of log over in seconds.
    map $request_uri $log_path {
        "~^(?<log_path_head>[^?]{0,512})" $log_path_head;
    }
    map $http_user_agent $log_user_agent {
        "~^(?<log_user_agent_head>.{0,256})" $log_user_agent_head;
    }
    map $http_referer $log_referer {
        "~^(?<log_referer_head>.{0,256})" $log_referer_head;
    }

    # The stack's one access log: the backend logs only events and errors.
    # JSON, like the backend's lines, so one parser reads both; times are in
    # seconds, and upstream_response_time is empty when nginx answered alone.
    # request_id is sent to the backend too (proxy_params.conf), whose lines
    # during the request carry it.
    log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr",'
                    '"request_id":"$request_id",'
                    '"method":"$request_method","path":"$log_path",'
                    '"protocol":"$server_protocol","status":$status,'
                    '"bytes":$body_bytes_sent,"request_time":$request_time,'
                    '"upstream_response_time":"$upstream_response_time",'
                    '"referer":"$log_referer","user_agent":"$log_user_agent"}';

    # One refused (429) request in 100 is logged. A client flooding past the
    # rate limits can send thousands a second, and a line for each would roll
    # Docker's 30 MB over in seconds, erasing every earlier line, its own
    # start and other users' requests included. The sample still shows who
    # flooded, when and what (multiply by 100 for the volume); a single 429
    # a real user got is likely not logged. Every other status is.
    split_clients "${request_id}" $sample_429 {
        1% 1;
        * 0;
    }
    map $status $log_request {
        429 $sample_429;
        default 1;
    }

    access_log /var/log/nginx/access.log json if=$log_request;
    error_log /var/log/nginx/error.log warn;

    # Refusals are logged below warn, so they leave the error log: its lines
    # keep the whole request line, query string included, and the Referer,
    # where the access line keeps neither.
    limit_req_log_level info;
    limit_conn_log_level info;

    # Performance
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    server_tokens off;

    # Rate limiting zones: see templates/00-rate-limits.conf.template
    # The backend upstream: see templates/00-upstream.conf.template

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Gzip compression. Static files are compressed at build time
    # (nginx/Dockerfile), so gzip_static serves those; gzip covers the rest,
    # mainly API responses.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
