# Every compose file names its own project, so dev, test and production
# never share containers or volumes. Rename it for a new app.
name: app

# Docker's default json-file driver never rotates, so on a long-running
# server container logs grow until the disk fills. Every service uses this.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Applied to every service: no setuid binary can raise a process's privileges.
x-security: &security
  security_opt:
    - no-new-privileges:true

# The backend image needs no capabilities and writes nowhere but gunicorn's
# worker heartbeat files in /tmp. Shared by backend and migrate.
x-backend-hardening: &backend-hardening
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

# The backend's address on the edge network, fixed so that nginx reaches a
# recreated backend container the moment it listens, with no DNS lookup
# (nginx/templates/00-upstream.conf.template). Set EDGE_SUBNET_PREFIX in
# .env.prod if 10.217.0.0/24 is already in use on the host.
x-backend-address: &backend-address "${EDGE_SUBNET_PREFIX:-10.217.0}.10"

# What the app reads, interpolated from --env-file .env.prod, so the root
# and migration passwords stay out. The URLs are built from .env.prod's
# parts unless it sets the URL itself. APP_ENV is fixed by this file.
x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}}
  REDIS_URL: ${REDIS_URL:-redis://app:${REDIS_PASSWORD}@redis:6379/0}
  SECRET_KEY: ${SECRET_KEY}

services:
  db:
    logging: *logging
    <<: *security
    image: mysql:8.4.11
    # InnoDB's cache of table and index pages. The default, 128M, would leave
    # most of this container's 1g unused and send reads to disk once the data
    # outgrows it. About half the memory limit leaves room for per-connection
    # buffers; resize both together as the data grows.
    command: ["--innodb-buffer-pool-size=512M"]
    # Only the variables MySQL needs, interpolated from the --env-file passed
    # to docker compose, so SECRET_KEY and the Redis password stay out. The
    # image makes MYSQL_USER, the migration user, owner of MYSQL_DATABASE;
    # db/init/01-app-user.sh adds the app's DB_USER, with data rights only.
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_MIGRATION_USER}
      MYSQL_PASSWORD: ${DB_MIGRATION_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # ping exits 0 whenever the server is up, even if auth fails, so no
      # credentials need to appear in the process list
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 40s
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
          pids: 256
        reservations:
          cpus: "0.5"
          memory: 512m

  redis:
    logging: *logging
    <<: *security
    image: redis:8.10-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}  # lets the healthcheck authenticate
    # Redis holds the refresh-token allowlist and rate-limit counters, so
    # nothing may be evicted: noeviction makes a full Redis fail loudly instead
    # of silently logging users out and resetting limits. maxmemory stays below
    # the container limit to leave room for the AOF rewrite fork.
    # ACL: the built-in "default" user is off; the app's user may touch only
    # its own keys and no @dangerous command (FLUSHALL, CONFIG, KEYS, ...),
    # nor any command of the modules the image loads (search, JSON, time
    # series, probabilistic), which @dangerous does not cover.
    # A list, not one string: compose would read the ">" before the password
    # as a shell redirect and silently drop every argument after it.
    command:
      - redis-server
      - --user
      - default
      - "off"
      - --user
      - app
      - "on"
      - ">${REDIS_PASSWORD}"
      - "~refresh_tokens:*"
      - "~LIMITS:*"
      - "+@all"
      - "-@dangerous"
      - "-@search"
      - "-@json"
      - "-@timeseries"
      - "-@bloom"
      - "-@cuckoo"
      - "-@cms"
      - "-@topk"
      - "-@tdigest"
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    # Time to flush the AOF on SIGTERM. Docker's default grace period is not
    # fixed (Docker Desktop kills after about 1s), so every service sets one.
    stop_grace_period: 10s
    healthcheck:
      # redis-cli exits 0 even when AUTH fails, so look for the PONG itself;
      # this also proves the app's credentials work
      test: ["CMD-SHELL", "redis-cli --user app ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 64
        reservations:
          cpus: "0.25"
          memory: 128m

  # One-shot: applies migrations as the migration user, which owns the
  # schema, and exits. The backend starts once it succeeds, holding only the
  # app user's credentials, which cannot change the schema.
  migrate:
    logging: *logging
    <<: [*security, *backend-hardening]
    build: ./backend
    command: ["flask", "db", "upgrade"]
    environment:
      <<: *backend-env
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-mysql+pymysql://${DB_MIGRATION_USER}:${DB_MIGRATION_PASSWORD}@db:3306/${DB_NAME}}
      DB_QUERY_TIMEOUT: "0"  # a migration may outlast the app's 15s limit
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 64

  backend:
    logging: *logging
    <<: [*security, *backend-hardening]
    build: ./backend
    environment: *backend-env
    # Looking up a stopped container's name (Redis or MySQL during an outage)
    # waits on DNS servers this network cannot reach: 4s per try by default.
    # One 1s try lets the app's own timeouts fail requests fast.
    dns_opt:
      - timeout:1
      - attempts:1
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: *backend-address
      internal:
    restart: unless-stopped
    # Longer than gunicorn's --graceful-timeout, so in-flight requests finish
    # before Docker's SIGKILL
    stop_grace_period: 35s
    healthcheck:
      # start_period covers the entrypoint's wait-for-services, which gives up
      # after the same 60s (TIMEOUT_SECONDS in backend/wait_for_services.py)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Sized for gunicorn's default 2 workers x 4 threads (backend/Dockerfile).
    # To scale, add WEB_CONCURRENCY to this service's environment (merge it
    # with <<: *backend-env) at about one worker per CPU, and raise cpus to
    # match; add ~128m of memory per worker.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 128
        reservations:
          cpus: "0.5"
          memory: 256m

  nginx:
    logging: *logging
    <<: *security
    build:
      context: .
      dockerfile: nginx/Dockerfile
    environment:
      # The domain this deployment serves; requests for any other host are
      # dropped (see nginx/templates/default.conf.template)
      NGINX_SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME in .env.prod}
      NGINX_BACKEND_ADDRESS: *backend-address
    # The master process binds 80/443, owns its cache directories, reads the
    # TLS key (mode 600, whoever owns it on the host) and switches workers to
    # the nginx user; nothing else is needed.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    # nginx's SIGQUIT lets in-flight requests finish; match the backend
    stop_grace_period: 35s
    networks:
      - edge
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 64
        reservations:
          cpus: "0.25"
          memory: 128m

# nginx reaches only the backend; MySQL and Redis sit on a network with no
# route out of the host, reachable only from the backend.
networks:
  edge:
    ipam:
      config:
        - subnet: "${EDGE_SUBNET_PREFIX:-10.217.0}.0/24"
          # Addresses Docker hands out (nginx's) come from the top half, so
          # none can take the backend's
          ip_range: "${EDGE_SUBNET_PREFIX:-10.217.0}.128/25"
  internal:
    internal: true

volumes:
  db_data:
  redis_data:
