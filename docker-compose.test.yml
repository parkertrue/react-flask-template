# Every compose file names its own project, so dev, test and production
# never share containers or volumes. Rename it for a new app.
name: app_test

# As in docker-compose.yml, on a subnet of its own so the stacks can run side
# by side: nginx reaches the backend at this fixed address
x-backend-address: &backend-address "${EDGE_SUBNET_PREFIX:-10.217.1}.10"

services:
  db:
    image: mysql:8.4.11
    # Production's hardening, so E2E catches an image that breaks under it
    # (.github/scripts/check_compose.py compares the two)
    security_opt:
      - no-new-privileges:true
    # Only the variables MySQL needs, interpolated from the --env-file passed
    # to docker compose, so SECRET_KEY and the Redis password stay out. The
    # keys are the MySQL image's own names; the app reads DB_* everywhere.
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      # ping exits 0 whenever the server is up, even if auth fails, so no
      # credentials need to appear in the process list
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: "no"
    ports:
      - "127.0.0.1:3307:3306"
    mem_limit: 512m
    cpus: 0.5
    # Production's pids limits on every service, so E2E catches a change that
    # needs more processes
    pids_limit: 256
    tmpfs:
      - /var/lib/mysql
    # The tmpfs datadir counts toward mem_limit, and so does
    # performance_schema (~235 MB): with the defaults this throwaway database
    # sat at its limit and swapped. It needs no diagnostics, and a 32 MB redo
    # log rather than 100 MB: under 32 MB, the image's first start logs that
    # threads are waiting for redo space (MY-014084).
    command:
      - --performance-schema=OFF
      - --innodb-redo-log-capacity=32M

  redis:
    image: redis:8.10-alpine
    security_opt:  # as db
      - no-new-privileges:true
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}  # lets the healthcheck authenticate
    # noeviction and the ACL user: see docker-compose.yml
    command:
      - redis-server
      - --user
      - default
      - "off"
      - --user
      - app
      - "on"
      - ">${REDIS_PASSWORD}"
      - "~refresh_tokens:*"
      - "~LIMITS:*"
      - "+@all"
      - "-@dangerous"
      - "-@search"
      - "-@json"
      - "-@timeseries"
      - "-@bloom"
      - "-@cuckoo"
      - "-@cms"
      - "-@topk"
      - "-@tdigest"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      # redis-cli exits 0 even when AUTH fails, so look for the PONG itself;
      # this also proves the app's credentials work
      test: ["CMD-SHELL", "redis-cli --user app ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: "no"
    ports:
      - "127.0.0.1:6380:6379"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  # Same as docker-compose.yml. One-shot: applies migrations as root, then
  # leaves DB_USER with data rights only (backend/restrict_db_user.py), and
  # exits. The backend starts once it succeeds, holding credentials that
  # cannot change the schema.
  migrate:
    build: ./backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    command: ["sh", "-c", "flask db upgrade && python restrict_db_user.py"]
    environment:
      APP_ENV: integration
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      APP_DB_USER: ${DB_USER}
      DB_QUERY_TIMEOUT: "0"  # as in docker-compose.yml
      REDIS_HOST: redis
      REDIS_USERNAME: app
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    pids_limit: 64
    profiles:
      - e2e

  backend:
    build: ./backend
    dns_opt:  # as in docker-compose.yml
      - timeout:1
      - attempts:1
    # Same hardening as docker-compose.yml, so E2E catches anything it breaks
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Only what the app reads, interpolated from --env-file .env.test. Hosts
    # are service names and ports the defaults inside the Docker network.
    environment:
      APP_ENV: integration
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_USERNAME: app
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      # Only Playwright uses this service, and a browser sends the refresh
      # cookie's CSRF header, so keep CSRF protection on (IntegrationConfig).
      E2E_MODE: "true"
    networks:
      default:
        ipv4_address: *backend-address
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    healthcheck:
      # start_period covers the entrypoint's wait-for-services, which gives up
      # after the same 60s (TIMEOUT_SECONDS in backend/wait_for_services.py)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    profiles:
      - e2e

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    # Same hardening as docker-compose.yml, so E2E catches anything it breaks
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    environment:
      # The E2E suite logs in and registers many times from one address
      NGINX_AUTH_RATE: 600r/m
      NGINX_BACKEND_ADDRESS: *backend-address
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    profiles:
      - e2e

networks:
  default:
    ipam:
      config:
        - subnet: "${EDGE_SUBNET_PREFIX:-10.217.1}.0/24"
          # Addresses Docker hands out come from the top half, so no other
          # container can take the backend's
          ip_range: "${EDGE_SUBNET_PREFIX:-10.217.1}.128/25"
